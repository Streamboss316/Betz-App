<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Test - BETZ</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0A0A0F;
            color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #16161D;
            border: 1px solid #2D2D3A;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h1 {
            color: #8B5CF6;
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 700;
        }
        .subtitle {
            color: #9CA3AF;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #1F1F28;
            border: 1px solid #2D2D3A;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #8B5CF6;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #8B5CF6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        }
        button:hover {
            background: #7C3AED;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
        }
        .success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #10B981;
        }
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #EF4444;
        }
        .credentials {
            background: #1F1F28;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #2D2D3A;
        }
        .credentials p {
            margin: 8px 0;
            font-size: 14px;
        }
        .credentials strong {
            color: #D4AF37;
        }
        .link {
            margin-top: 20px;
            text-align: center;
        }
        .link a {
            color: #8B5CF6;
            text-decoration: none;
            font-weight: 500;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin Login Test</h1>
        <p class="subtitle">Test your admin credentials directly</p>

        <div class="credentials">
            <p><strong>Current Admin Email:</strong></p>
            <p>streamboss316@gmail.com</p>
            <p><strong>Current Admin Password:</strong></p>
            <p>sanaa3030</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="streamboss316@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="sanaa3030" required>
            </div>
            <button type="submit" id="submitBtn">Test Login</button>
        </form>

        <div id="result" class="result"></div>

        <div class="link">
            <a href="/admin/login">Go to Admin Login Page →</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Testing...';
            result.style.display = 'none';
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>✅ SUCCESS!</strong><br><br>
                        Login working correctly!<br>
                        Token: ${data.access_token.substring(0, 30)}...<br><br>
                        <strong>Your credentials are correct!</strong><br>
                        Please try clearing your browser cache completely (Ctrl+Shift+Delete)<br>
                        or use Incognito/Private browsing mode.
                    `;
                    result.style.display = 'block';
                } else {
                    result.className = 'result error';
                    result.innerHTML = `
                        <strong>❌ FAILED</strong><br><br>
                        ${data.detail || 'Login failed'}<br><br>
                        Please verify your credentials.
                    `;
                    result.style.display = 'block';
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `
                    <strong>❌ ERROR</strong><br><br>
                    Network error: ${error.message}<br><br>
                    Please check your internet connection.
                `;
                result.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Test Login';
            }
        });
    </script>
</body>
</html>
